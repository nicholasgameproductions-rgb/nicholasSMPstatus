name: NicholasSMP Discord Status
on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'
permissions:
  contents: read
concurrency:
  group: nicholassmp-status
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
        run: python status.py
